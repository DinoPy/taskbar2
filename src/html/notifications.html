<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Notifications</title>
	<link href="../styles/variables.css" rel="stylesheet" />
	<link href="../styles/notifications.css" rel="stylesheet" />
	<script type="module" src="../js/notificationsWindow.js"></script>
</head>

<body>
	<div class="notifications-root">
		<header class="notifications-header">
			<div>
				<h2>Notifications</h2>
				<p class="notifications-subtitle"></p>
			</div>
			<button class="text-btn mark-all-btn" data-action="mark-all" title="Mark all as viewed">
				Mark all viewed
			</button>
		</header>

		<!-- Tab Navigation -->
		<nav class="tab-nav">
			<button class="tab-btn active" data-tab="unseen">New</button>
			<button class="tab-btn" data-tab="history">History</button>
			<button class="tab-btn" data-tab="schedules">Schedules</button>
		</nav>

		<!-- Unseen Tab -->
		<section class="tab-content active" data-tab-content="unseen">
			<ul class="notifications-list" id="unseenList"></ul>
			<p class="empty-state" data-empty="unseen">You're all caught up</p>
		</section>

		<!-- History Tab -->
		<section class="tab-content" data-tab-content="history">
			<div class="history-scroll">
				<ul class="notifications-list" id="historyList"></ul>
				<p class="empty-state" data-empty="history">Nothing viewed recently</p>
				<p class="loading-indicator" id="historyLoading">Loading more…</p>
			</div>
		</section>

		<!-- Schedules Tab -->
		<section class="tab-content" data-tab-content="schedules">
			<ul class="schedules-list" id="schedulesList"></ul>
			<p class="empty-state" data-empty="schedules">No active schedules</p>
		</section>
	</div>
</body>

</html>
