<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scheduler Calendar</title>
		<link rel="stylesheet" href="../styles/variables.css" />
		<link rel="stylesheet" href="../styles/calendar.css?v=12345" />
	</head>
	<body>
		<div class="calendar-root">
			<header class="calendar-header">
				<div class="calendar-controls">
					<button type="button" data-action="prev-week" aria-label="Previous week">←</button>
					<button type="button" data-action="next-week" aria-label="Next week">→</button>
				</div>
				<div class="calendar-title" id="calendarWeekLabel">Loading…</div>
				<button type="button" data-action="today" class="today-btn">Today</button>
				<div class="calendar-search-wrapper">
					<input type="text" class="calendar-search-input" data-search-input placeholder="Search schedules..." autocomplete="off" />
					<div class="calendar-search-results hidden" data-search-results></div>
				</div>
				<details class="calendar-filters" data-calendar-filters>
					<summary>Filters</summary>
						<div class="calendar-filters-panel">
							<div class="calendar-filters-group">
								<div class="calendar-filters-group-title">View</div>
								<label class="calendar-filter-option">
									<input type="checkbox" data-filter-hide-past />
									<span>Hide past occurrences</span>
								</label>
							</div>
							<div class="calendar-filters-group">
								<div class="calendar-filters-group-title">Hide kinds</div>
								<label class="calendar-filter-option">
								<input type="checkbox" data-filter-kind="task" />
								<span>Tasks</span>
							</label>
							<label class="calendar-filter-option">
								<input type="checkbox" data-filter-kind="reminder" />
								<span>Reminders</span>
							</label>
						</div>
						<div class="calendar-filters-group">
							<div class="calendar-filters-group-title">Hide states</div>
							<label class="calendar-filter-option">
								<input type="checkbox" data-filter-state="planned" />
								<span>Planned</span>
							</label>
							<label class="calendar-filter-option">
								<input type="checkbox" data-filter-state="canceled" />
								<span>Canceled</span>
							</label>
							<label class="calendar-filter-option">
								<input type="checkbox" data-filter-state="completed" />
								<span>Completed</span>
							</label>
							<label class="calendar-filter-option">
								<input type="checkbox" data-filter-state="skipped" />
								<span>Skipped</span>
							</label>
							<label class="calendar-filter-option">
								<input type="checkbox" data-filter-state="deleted" />
								<span>Deleted</span>
							</label>
						</div>
						<div class="calendar-filters-group">
							<div class="calendar-filters-group-title">Hide schedules</div>
							<div class="calendar-filters-schedules" data-filter-schedule-list></div>
							<button type="button" class="calendar-filter-clear" data-action="clear-hidden-schedules">
								Show all schedules
							</button>
						</div>
						<div class="calendar-filters-updated" data-filter-updated-at></div>
					</div>
				</details>
			</header>
			<div class="calendar-grid-wrapper">
				<div class="calendar-grid-header" aria-hidden="true">
					<span>Mon</span>
					<span>Tue</span>
					<span>Wed</span>
					<span>Thu</span>
					<span>Fri</span>
					<span>Sat</span>
					<span>Sun</span>
				</div>
				<div class="calendar-grid" data-calendar-grid></div>
			</div>
			<div class="calendar-footer">
				<div class="calendar-empty-state hidden" data-empty-state>Drag the week arrows to load events.</div>
				<div class="calendar-loading" data-loading>Loading…</div>
			</div>
		</div>
		<script type="module" src="../js/calendarWindow.js?v=12345"></script>
	</body>
</html>
